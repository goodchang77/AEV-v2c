version: '3.8'

services:
  # PostgreSQL 主資料庫
  postgres:
    image: postgres:15-alpine
    container_name: financial_postgres_simple
    environment:
      POSTGRES_DB: financial_analysis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financial_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_analysis"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 快取層
  redis:
    image: redis:7-alpine
    container_name: financial_redis_simple
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - financial_network
    command: redis-server --appendonly yes --requirepass dev_redis_2024
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev_redis_2024", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # TimescaleDB 時序資料庫
  timescaledb:
    image: timescale/timescaledb:2.11.0-pg15
    container_name: financial_timescale_simple
    environment:
      POSTGRES_DB: timeseries_financial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password_2024
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - financial_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timeseries_financial"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  timescale_data:
    driver: local

networks:
  financial_network:
    driver: bridge