version: '3.8'

services:
  # PostgreSQL 主資料庫
  postgres:
    image: postgres:15-alpine
    container_name: financial_postgres
    environment:
      POSTGRES_DB: financial_analysis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - financial_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_analysis"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 快取層
  redis:
    image: redis:7-alpine
    container_name: financial_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - financial_network
    command: redis-server --appendonly yes --requirepass dev_redis_2024
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # TimescaleDB 時序資料庫（股價資料用）
  timescaledb:
    image: timescale/timescaledb:2.11.0-pg15
    container_name: financial_timescale
    environment:
      POSTGRES_DB: timeseries_financial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password_2024
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./database/timescale_init:/docker-entrypoint-initdb.d
    networks:
      - financial_network
    restart: unless-stopped

  # pgAdmin 資料庫管理界面
  pgadmin:
    image: dpage/pgadmin4:7
    container_name: financial_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@financial.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - financial_network
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  timescale_data:
  pgadmin_data:

networks:
  financial_network:
    driver: bridge