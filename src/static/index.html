<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEV · 財務分析與企業評價系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #0b0f17;
    --bg-elev: #0f1520;
    --panel: #131a26;
    --panel-2: #161e2c;
    --hairline: #1e293b;
    --hairline-2: #26334a;
    --text: #d8e1ec;
    --muted: #8b98ab;
    --faint: #5b6a80;
    --accent: #4f9df7;
    --cyan: #22d3ee;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --rail-w: 56px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 13px; line-height: 1.5;
    display: flex; overflow: hidden;
  }
  /* ---------- Icon rail ---------- */
  .rail {
    width: var(--rail-w); min-width: var(--rail-w);
    background: var(--bg-elev); border-right: 1px solid var(--hairline);
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 0; gap: 4px; z-index: 20;
  }
  .rail .logo {
    width: 34px; height: 34px; border-radius: 8px; margin-bottom: 12px;
    background: linear-gradient(135deg, var(--accent), var(--cyan));
    display: grid; place-items: center; font-weight: 700; color: #06121f; font-size: 15px;
  }
  .rail button {
    width: 40px; height: 40px; border: none; border-radius: 8px; background: transparent;
    color: var(--faint); cursor: pointer; display: grid; place-items: center;
    transition: background .15s, color .15s;
  }
  .rail button svg { width: 18px; height: 18px; }
  .rail button:hover { background: var(--panel-2); color: var(--muted); }
  .rail button.active { background: rgba(79,157,247,.14); color: var(--accent); }
  .rail .spacer { flex: 1; }
  /* ---------- App shell ---------- */
  .app { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .topbar {
    display: flex; align-items: center; gap: 14px; padding: 0 18px; height: 50px;
    border-bottom: 1px solid var(--hairline); background: var(--bg-elev);
  }
  .topbar .brand { font-weight: 600; font-size: 14px; letter-spacing: .02em; white-space: nowrap; }
  .topbar .brand span { color: var(--accent); }
  .searchwrap { flex: 1; max-width: 460px; position: relative; }
  .searchwrap input {
    width: 100%; background: var(--panel); border: 1px solid var(--hairline-2);
    border-radius: 6px; color: var(--text); padding: 7px 12px; font-size: 13px;
  }
  .searchwrap input:focus { outline: none; border-color: var(--accent); }
  .searchwrap .hint {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    color: var(--faint); font-size: 11px; pointer-events: none;
  }
  .authrow { display: flex; gap: 6px; align-items: center; }
  .authrow input {
    width: 96px; background: var(--panel); border: 1px solid var(--hairline-2);
    border-radius: 6px; color: var(--text); padding: 6px 9px; font-size: 12px;
  }
  .authrow input:focus { outline: none; border-color: var(--accent); }
  .entitybar {
    display: flex; align-items: center; gap: 18px; padding: 0 18px; height: 44px;
    border-bottom: 1px solid var(--hairline); background: var(--bg-elev);
  }
  .entitybar .entity { font-weight: 600; font-size: 14px; white-space: nowrap; }
  .entitybar .entity .meta { color: var(--faint); font-weight: 400; font-size: 12px; }
  .entitybar .tabs { display: flex; gap: 2px; overflow-x: auto; }
  .entitybar .tabs button {
    background: transparent; border: none; color: var(--muted); font-size: 12px;
    padding: 6px 10px; cursor: pointer; border-radius: 5px; white-space: nowrap;
    letter-spacing: .03em;
  }
  .entitybar .tabs button:hover { color: var(--text); }
  .entitybar .tabs button.active { color: var(--accent); background: rgba(79,157,247,.1); }
  /* ---------- Content ---------- */
  main { flex: 1; overflow-y: auto; padding: 18px; }
  .view { display: none; }
  .view.active { display: block; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi {
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 8px; padding: 14px 16px;
    position: relative; overflow: hidden;
  }
  .kpi .kpi-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px;
  }
  .kpi .kpi-value { font-size: 24px; font-weight: 600; font-family: var(--mono); letter-spacing: -.02em; }
  .kpi .kpi-value small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .kpi .kpi-sub { font-size: 11px; color: var(--faint); margin-top: 4px; }
  .kpi .kpi-bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--hairline); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .panel-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
    margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--hairline);
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel-title .right { color: var(--faint); font-size: 11px; letter-spacing: 0; text-transform: none; }
  .chart { width: 100%; height: 300px; }
  .chart.sm { height: 220px; }
  /* ---------- Buttons / inputs ---------- */
  button.btn {
    background: var(--accent); border: none; color: #06121f; font-weight: 600;
    font-size: 12px; padding: 7px 14px; border-radius: 6px; cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.12); }
  button.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--hairline-2); }
  button.btn.ghost:hover { border-color: var(--accent); }
  button.btn.danger { background: transparent; color: var(--red); border: 1px solid var(--hairline-2); }
  input.in, select.in {
    background: var(--panel-2); border: 1px solid var(--hairline-2); border-radius: 6px;
    color: var(--text); padding: 7px 10px; font-size: 12px; font-family: var(--mono);
  }
  input.in:focus { outline: none; border-color: var(--accent); }
  label.f { display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--muted); letter-spacing: .03em; }
  .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 10px; }
  /* ---------- Tables ---------- */
  table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.t th {
    text-align: right; color: var(--muted); font-weight: 500; font-size: 11px;
    text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px;
    border-bottom: 1px solid var(--hairline-2); white-space: nowrap;
  }
  table.t th:first-child, table.t td:first-child { text-align: left; }
  table.t td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--hairline); font-family: var(--mono); white-space: nowrap; }
  table.t tr:hover td { background: rgba(79,157,247,.05); }
  /* ---------- Badges / text ---------- */
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.good { background: rgba(52,211,153,.14); color: var(--green); }
  .badge.warn { background: rgba(251,191,36,.14); color: var(--amber); }
  .badge.bad { background: rgba(248,113,113,.14); color: var(--red); }
  .badge.info { background: rgba(79,157,247,.14); color: var(--accent); }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .mono { font-family: var(--mono); }
  .big-num { font-size: 34px; font-weight: 600; font-family: var(--mono); letter-spacing: -.02em; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 12px; }
  .kv b { color: var(--muted); font-weight: 500; }
  ul.tight { margin: 6px 0 0; padding-left: 16px; font-size: 12px; }
  ul.tight li { margin: 4px 0; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .dimbar { height: 6px; background: var(--hairline); border-radius: 3px; overflow: hidden; }
  .dimbar i { display: block; height: 100%; border-radius: 3px; }
  .scorebar-row { display: grid; grid-template-columns: 110px 1fr 46px; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 12px; }
  textarea.pre {
    width: 100%; height: 300px; background: var(--bg-elev); color: var(--text);
    border: 1px solid var(--hairline); border-radius: 6px; padding: 10px;
    font-family: var(--mono); font-size: 12px; resize: vertical;
  }
  .toast {
    position: fixed; right: 18px; bottom: 18px; background: var(--panel-2);
    border: 1px solid var(--accent); border-radius: 8px; padding: 10px 16px;
    font-size: 12px; z-index: 50; display: none;
  }
</style>
</head>
<body>

<!-- ====================== Icon rail ====================== -->
<aside class="rail">
  <div class="logo">◆</div>
  <button data-view="overview" class="active" title="總覽">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
  </button>
  <button data-view="financials" title="財務">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
  </button>
  <button data-view="valuation" title="估值">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
  </button>
  <button data-view="peers" title="同業">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 19c0-3 2.5-5 6.5-5s6.5 2 6.5 5M14.5 13.5c3 .3 5 2 5 4.5"/></svg>
  </button>
  <button data-view="risk" title="風險">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 4v6c0 5-3.8 8.4-9 10-5.2-1.6-9-5-9-10V6l9-4z"/></svg>
  </button>
  <button data-view="reports" title="報告">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l4 4v16H6z"/><path d="M15 2v5h5M9 12h6M9 16h6"/></svg>
  </button>
  <button data-view="portfolio" title="投資組合">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
  </button>
  <div class="spacer"></div>
</aside>

<!-- ====================== App ====================== -->
<div class="app">
  <header class="topbar">
    <div class="brand"><span>AEV</span> · 財務分析與企業評價</div>
    <div class="searchwrap">
      <input id="q" placeholder="搜尋公司（代號或名稱）" onkeydown="if(event.key==='Enter')search()">
      <span class="hint">↵</span>
    </div>
    <div class="authrow" id="authRow">
      <input id="auth_user" placeholder="帳號">
      <input id="auth_pass" type="password" placeholder="密碼">
      <button class="btn" onclick="doLogin()">登入</button>
      <button class="btn ghost" onclick="doRegister()">註冊</button>
      <span id="authStatus" class="faint" style="font-size:11px"></span>
    </div>
  </header>

  <div class="entitybar">
    <div class="entity" id="entityTitle"><span class="mono">—</span> <span class="meta">請選擇公司</span></div>
    <div class="tabs" id="tabs"></div>
  </div>

  <main>
    <!-- ============ OVERVIEW ============ -->
    <section class="view active" id="view-overview">
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-label">ROE · 股東權益報酬率</div><div class="kpi-value" id="kRoe">—</div><div class="kpi-sub" id="kRoeSub">—</div><div class="kpi-bar" id="kRoeBar" style="width:0%"></div></div>
        <div class="kpi"><div class="kpi-label">財務健康度</div><div class="kpi-value" id="kHealth">—<small>/100</small></div><div class="kpi-sub" id="kHealthSub">—</div><div class="kpi-bar" id="kHealthBar" style="width:0%"></div></div>
        <div class="kpi"><div class="kpi-label">綜合風險分數</div><div class="kpi-value" id="kRisk">—</div><div class="kpi-sub" id="kRiskSub">—</div><div class="kpi-bar" id="kRiskBar" style="width:0%"></div></div>
        <div class="kpi"><div class="kpi-label">Altman Z-Score</div><div class="kpi-value" id="kZ">—</div><div class="kpi-sub" id="kZSub">—</div><div class="kpi-bar" id="kZBar" style="width:0%"></div></div>
      </div>
      <div class="grid-2">
        <div class="panel"><div class="panel-title">營收與獲利趨勢 <span class="right" id="ovTrendNote"></span></div><div id="ovTrendChart" class="chart"></div></div>
        <div class="panel"><div class="panel-title">風險四維度</div><div id="ovRiskChart" class="chart"></div></div>
      </div>
    </section>

    <!-- ============ FINANCIALS ============ -->
    <section class="view" id="view-financials">
      <div class="panel"><div class="panel-title">財務比率 <span class="right" id="finPeriod"></span></div><div id="finRatiosTable"></div></div>
      <div class="panel"><div class="panel-title">獲利能力趨勢</div><div id="finMarginsChart" class="chart sm"></div></div>
    </section>

    <!-- ============ VALUATION ============ -->
    <section class="view" id="view-valuation">
      <div class="two-col">
        <div class="panel">
          <div class="panel-title">DCF · 現金流折現</div>
          <div class="form-row">
            <label class="f">折現率<input class="in" id="dcf_rate" type="number" step="0.01" value="0.10"></label>
            <label class="f">終值成長率<input class="in" id="dcf_g" type="number" step="0.01" value="0.03"></label>
            <label class="f">成長率（逗號分隔）<input class="in" id="dcf_growth" value="0.10, 0.08, 0.06, 0.05, 0.04"></label>
          </div>
          <button class="btn" onclick="runDcf()">執行 DCF</button>
          <div id="dcfResult" class="muted" style="margin-top:12px"></div>
        </div>
        <div class="panel">
          <div class="panel-title">DDM · 股利折現</div>
          <div class="form-row">
            <label class="f">每股股利<input class="in" id="ddm_div" type="number" step="0.01" value="15"></label>
            <label class="f">股利成長率<input class="in" id="ddm_g" type="number" step="0.01" value="0.05"></label>
            <label class="f">折現率<input class="in" id="ddm_r" type="number" step="0.01" value="0.09"></label>
          </div>
          <button class="btn" onclick="runDdm()">執行 DDM</button>
          <div id="ddmResult" class="muted" style="margin-top:12px"></div>
        </div>
        <div class="panel">
          <div class="panel-title">PEG · 成長性評價</div>
          <div class="form-row">
            <label class="f">本益比 PE<input class="in" id="peg_pe" type="number" step="0.1" value="25"></label>
            <label class="f">EPS 成長率 %<input class="in" id="peg_g" type="number" step="0.1" value="20"></label>
          </div>
          <button class="btn" onclick="runPeg()">計算 PEG</button>
          <div id="pegResult" class="muted" style="margin-top:12px"></div>
        </div>
        <div class="panel">
          <div class="panel-title">蒙地卡羅 · DCF 風險模擬</div>
          <div class="form-row">
            <label class="f">模擬次數<input class="in" id="mc_n" type="number" step="100" value="1000"></label>
            <label class="f">折現率標準差<input class="in" id="mc_sd" type="number" step="0.01" value="0.01"></label>
          </div>
          <button class="btn" onclick="runMonteCarlo()">執行模擬</button>
          <div id="mcResult" class="muted" style="margin-top:12px"></div>
          <div id="mcChart" class="chart sm" style="margin-top:8px"></div>
        </div>
      </div>
    </section>

    <!-- ============ PEERS ============ -->
    <section class="view" id="view-peers">
      <div class="panel">
        <div class="panel-title">同業比較設定</div>
        <div class="form-row">
          <label class="f">目標公司<input class="in" id="peer_target" value="2330"></label>
          <label class="f">同業代號（逗號分隔）<input class="in" id="peer_ids" value="2317, 2454, 2303"></label>
        </div>
        <button class="btn" onclick="runPeer()">執行同業比較</button>
      </div>
      <div class="panel"><div class="panel-title">ROE / ROA 比較</div><div id="peerChart" class="chart sm"></div></div>
      <div class="panel"><div class="panel-title">比較結果</div><div id="peerResult" class="muted"></div></div>
    </section>

    <!-- ============ RISK ============ -->
    <section class="view" id="view-risk">
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-label">綜合風險分數</div><div class="kpi-value" id="rScore">—</div><div class="kpi-sub" id="rLevel"></div></div>
        <div class="kpi"><div class="kpi-label">Altman Z-Score</div><div class="kpi-value" id="rZ">—</div><div class="kpi-sub" id="rZLevel"></div></div>
        <div class="kpi"><div class="kpi-label">破產機率</div><div class="kpi-value" id="rProb">—</div><div class="kpi-sub">probability of bankruptcy</div></div>
      </div>
      <div class="panel"><div class="panel-title">四維度評分</div><div id="rDims"></div></div>
      <div class="two-col">
        <div class="panel"><div class="panel-title">關鍵風險</div><div id="rConcerns"></div></div>
        <div class="panel"><div class="panel-title">改善建議</div><div id="rRecs"></div></div>
      </div>
    </section>

    <!-- ============ REPORTS ============ -->
    <section class="view" id="view-reports">
      <div class="panel">
        <div class="panel-title">報告生成</div>
        <div class="form-row">
          <label class="f">類型
            <select class="in" id="rep_type"><option value="comprehensive">Comprehensive</option><option value="summary">Summary</option></select>
          </label>
          <label class="f">格式
            <select class="in" id="rep_format"><option value="markdown">Markdown</option><option value="pdf">PDF</option></select>
          </label>
        </div>
        <button class="btn" onclick="runReport()">產生報告</button>
        <button class="btn ghost" onclick="runExcel()">匯出 Excel</button>
        <div id="reportStatus" class="muted" style="margin-top:10px"></div>
      </div>
      <div class="panel"><div class="panel-title">預覽</div><textarea class="pre" id="reportPreview" placeholder="Markdown 報告會顯示於此；PDF/Excel 產生後自動下載"></textarea></div>
    </section>

    <!-- ============ PORTFOLIO ============ -->
    <section class="view" id="view-portfolio">
      <div class="panel">
        <div class="panel-title">投資組合 <span class="right" id="pfAuthNote">需登入</span></div>
        <div class="form-row">
          <label class="f">公司代號<input class="in" id="pf_cid" placeholder="2330"></label>
          <label class="f">股數<input class="in" id="pf_shares" type="number" step="0.01" placeholder="1000"></label>
          <label class="f">每股成本<input class="in" id="pf_cost" type="number" step="0.01" placeholder="500"></label>
          <label class="f">最新股價（選填）<input class="in" id="pf_price" type="number" step="0.01"></label>
        </div>
        <button class="btn" onclick="addPosition()">新增 / 更新部位</button>
      </div>
      <div class="panel"><div class="panel-title">部位與損益</div><div id="pfResult" class="muted">登入後顯示</div></div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "/api/v1";
const $ = (id) => document.getElementById(id);
const VIEWS = ["overview","financials","valuation","peers","risk","reports","portfolio"];
const VIEW_NAMES = {overview:"總覽", financials:"財務", valuation:"估值", peers:"同業", risk:"風險", reports:"報告", portfolio:"投資組合"};
const state = { company: null, view: "overview", token: localStorage.getItem("aev_token") || "" };
const charts = {};

function toast(msg, ms=2600) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", ms);
}

async function api(path, opts) {
  const r = await fetch(API + path, opts);
  if (!r.ok) {
    const b = await r.json().catch(() => ({}));
    throw new Error(b.detail?.message || b.detail || `HTTP ${r.status}`);
  }
  return r.json();
}
const authH = () => state.token ? { "Authorization": "Bearer " + state.token } : {};

/* ---------------- Search / entity ---------------- */
async function search() {
  const kw = $("q").value.trim(); if (!kw) return;
  try {
    const res = await api(`/companies/search?keyword=${encodeURIComponent(kw)}`);
    const list = res.data || [];
    if (list.length === 0) { toast("找不到符合的公司"); return; }
    selectCompany(list[0].company_id, list[0].company_name);
    if (list.length > 1) toast(`找到 ${list.length} 家，已選取 ${list[0].company_name}`);
  } catch (e) { toast(e.message); }
}
async function selectCompany(id, name) {
  state.company = { id, name: name || id };
  $("q").value = id;
  try {
    const r = await api(`/companies/${id}`);
    const c = r.data || {};
    state.company.info = c;
    $("entityTitle").innerHTML = `<span class="mono">${c.company_id}</span> ${c.company_name} <span class="meta">${c.industry_name || c.industry_code || "—"} · ${c.market_type || "—"} · 上市日 ${c.listing_date || "—"}</span>`;
  } catch (e) {
    $("entityTitle").innerHTML = `<span class="mono">${id}</span> ${name || ""} <span class="meta">${e.message}</span>`;
  }
  setView(state.view);
}

function downloadB64(b64, filename) {

  a.download = filename; document.body.appendChild(a); a.click(); a.remove();

    $("authStatus").textContent = "已登入"; toast("登入成功");
    if (state.view === "portfolio") viewPortfolio();
  } catch (e) { toast("登入失敗：" + e.message); }
}
async function doRegister() {
  try {
    const r = await api("/auth/register", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({username:$("auth_user").value, email:$("auth_user").value+"@demo.com", password:$("auth_pass").value})});
    state.token = r.access_token; localStorage.setItem("aev_token", state.token);
    $("authStatus").textContent = "已註冊"; toast("註冊成功");
    if (state.view === "portfolio") viewPortfolio();
  } catch (e) { toast("註冊失敗：" + e.message); }
}
async function addPosition() {
  if (!state.token) return toast("請先登入");
  try {
    await api("/portfolio/positions", {method:"POST", headers:{...authH(), "Content-Type":"application/json"}, body: JSON.stringify({
      company_id:$("pf_cid").value.trim(), shares:parseFloat($("pf_shares").value), cost_basis:parseFloat($("pf_cost").value),
      current_price: $("pf_price").value ? parseFloat($("pf_price").value) : null,
    })});
    toast("部位已儲存"); viewPortfolio();
  } catch (e) { toast(e.message); }
}
async function delPosition(cid) {
  try { await api(`/portfolio/positions/${cid}`, {method:"DELETE", headers:authH()}); viewPortfolio(); }
  catch (e) { toast(e.message); }
}
async function viewPortfolio() {
  if (!state.token) { $("pfResult").innerHTML = '<span class="faint">請先在右上角登入或註冊</span>'; return; }
  $("pfAuthNote").textContent = "已登入";
  try {
    const r = await api("/portfolio/summary", {headers:authH()});
    const d = r.data||{};
    $("pfResult").innerHTML = `
      <div style="display:flex; gap:28px; margin-bottom:12px; flex-wrap:wrap">
        <div><div class="kpi-label" style="font-size:11px;color:var(--muted);letter-spacing:.08em">總市值</div><div class="big-num" style="color:var(--accent)">${fmt(d.total_value)}</div></div>
        <div><div class="kpi-label" style="font-size:11px;color:var(--muted);letter-spacing:.08em">總成本</div><div class="big-num">${fmt(d.total_cost)}</div></div>
        <div><div class="kpi-label" style="font-size:11px;color:var(--muted);letter-spacing:.08em">總損益</div><div class="big-num ${(d.total_pnl??0)>=0?'pos':'neg'}">${fmt(d.total_pnl)}</div></div>
        <div><div class="kpi-label" style="font-size:11px;color:var(--muted);letter-spacing:.08em">報酬率</div><div class="big-num ${(d.total_pnl_pct??0)>=0?'pos':'neg'}">${fmt(d.total_pnl_pct)}%</div></div>
      </div>
      <table class="t">
        <tr><th>公司</th><th>股數</th><th>成本</th><th>現價</th><th>市值</th><th>損益%</th><th>ROE</th><th>PE</th><th></th></tr>
        ${(d.positions||[]).map(p=>`<tr>
          <td>${p.company_id} <span class="muted">${p.company_name||""}</span></td>
          <td>${fmt(p.shares)}</td><td>${fmt(p.cost_basis)}</td><td>${p.current_price ?? "—"}</td>
          <td>${fmt(p.market_value)}</td>
          <td class="${p.pnl>=0?'pos':'neg'}">${fmt(p.pnl_pct)}%</td>
          <td>${p.roe!=null?(p.roe*100).toFixed(1)+"%":"—"}</td><td>${p.pe_ratio ?? "—"}</td>
          <td><a href="#" class="neg" style="text-decoration:none" onclick="event.preventDefault();delPosition('${p.company_id}')">刪除</a></td>
        </tr>`).join("") || '<tr><td colspan="9" class="faint">尚無部位</td></tr>'}
      </table>`;
  } catch (e) { $("pfResult").innerHTML = `<span class="neg">${e.message}</span>`; }
}

/* ---------------- Boot ---------------- */
window.addEventListener("DOMContentLoaded", () => {
  initCharts(); initShell();
  $("q").value = "2330";
  selectCompany("2330", "台積電");
});
</script>
</body>
