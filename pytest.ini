[tool:pytest]
# pytest配置文件

# 測試目錄
testpaths = tests

# 測試文件模式
python_files = test_*.py *_test.py

# 測試類模式
python_classes = Test*

# 測試函數模式
python_functions = test_*

# 標記定義
markers =
    unit: 單元測試
    integration: 整合測試
    e2e: 端到端測試
    slow: 執行時間較長的測試
    pdf: PDF處理相關測試
    api: API相關測試
    
# 添加選項
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    
# 最小測試覆蓋率
# --cov=src
# --cov-report=html
# --cov-report=term-missing
# --cov-fail-under=80

# 並行測試 (需要安裝 pytest-xdist)
# -n auto

# 日誌配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 異步測試支持
asyncio_mode = auto

# 過濾警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:*asyncio*
    ignore::UserWarning:*uvloop*